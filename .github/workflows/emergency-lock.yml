name: Emergency lock laboratory
"on":
  pull_request:
    paths: ['android/**', 'scripts/**', '.github/workflows/emergency-lock.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: emergency-lock-${{ github.ref }}
  cancel-in-progress: false
jobs:
  emergency-lock:
    strategy:
      fail-fast: false
      matrix:
        optimized: [false, true]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Record the tested checkout
        run: |
          mkdir -p android/app/build/reports/emergency-lock
          git rev-parse HEAD > android/app/build/reports/emergency-lock/commit.txt
          git rev-parse HEAD^{tree} > android/app/build/reports/emergency-lock/tree.txt
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "emulator" "system-images;android-35;default;x86_64"
      - run: bash scripts/codex_setup.sh
      - name: Build both real application flavors and isolated test APKs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.optimized }}" = true ]; then
            gradle -p android --no-daemon -PumbraVaultLab=true :app:assembleConnectedVaultLab :app:assembleOfflineVaultLab :app:assembleConnectedVaultLabAndroidTest :app:assembleOfflineVaultLabAndroidTest
          else
            gradle -p android --no-daemon :app:assembleConnectedDebug :app:assembleOfflineDebug :app:assembleConnectedDebugAndroidTest :app:assembleOfflineDebugAndroidTest
          fi
      - name: Coordinated closure with real SQLite and Android Keystore
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          export UMBRA_DEVICE_REPORTS=android/app/build/reports/emergency-lock
          export UMBRA_STARTUP_DNS=127.0.0.1
          source scripts/ci_emulator.sh
          umbra_start_avd umbra-emergency-lock 5554
          . .venv/bin/activate
          options=()
          if [ "${{ matrix.optimized }}" = true ]; then options+=(--optimized); fi
          for flavor in connected offline; do
            python scripts/run_emergency_tests.py --serial emulator-5554 --flavor "$flavor" "${options[@]}" --reports "$UMBRA_DEVICE_REPORTS/$flavor"
            python scripts/run_private_startup.py --emergency --serial emulator-5554 --flavor "$flavor" "${options[@]}" --reports "$UMBRA_DEVICE_REPORTS/$flavor/restart"
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: emergency-lock-${{ matrix.optimized }}-${{ github.sha }}
          path: |
            android/app/build/reports/emergency-lock/
            android/app/build/outputs/mapping/*VaultLab/
          if-no-files-found: error
          retention-days: 7
  emergency-media:
    strategy:
      fail-fast: false
      matrix:
        optimized: [false, true]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "emulator" "system-images;android-35;default;x86_64"
      - run: python -m pip install -r relay/requirements-test.lock
      - name: Build isolated non-debuggable R8 target and test APK
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.optimized }}" = true ]; then
            gradle -p android --no-daemon -PumbraMediaLab=true :app:assembleConnectedMediaLab :app:assembleConnectedMediaLabAndroidTest
          else
            gradle -p android --no-daemon :app:assembleConnectedDebug :app:assembleConnectedDebugAndroidTest
          fi
      - name: Check optimized implementation and APK identity
        run: |
          set -euo pipefail
          mkdir -p android/app/build/reports/emergency-media
          git rev-parse HEAD > android/app/build/reports/emergency-media/commit.txt
          git rev-parse HEAD^{tree} > android/app/build/reports/emergency-media/tree.txt
          if [ "${{ matrix.optimized }}" = true ]; then python scripts/check_optimized_media.py > android/app/build/reports/emergency-media/optimized-apk.json; fi
      - name: Execute real two-AVD voice on R8 code
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tcpdump
          export UMBRA_DEVICE_REPORTS=android/app/build/reports/emergency-media
          source scripts/ci_emulator.sh
          umbra_start_avd umbra-r8-a 5554
          umbra_start_avd umbra-r8-b 5556
          options=()
          if [ "${{ matrix.optimized }}" = true ]; then options+=(--optimized); fi
          python scripts/run_voice_integration.py --a emulator-5554 --b emulator-5556 "${options[@]}" --scenario emergency-lock --reports "$UMBRA_DEVICE_REPORTS/voice"
          python scripts/run_voice_integration.py --a emulator-5554 --b emulator-5556 "${options[@]}" --video --scenario emergency-lock --reports "$UMBRA_DEVICE_REPORTS/video"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: emergency-media-evidence-${{ matrix.optimized }}-${{ github.sha }}
          path: |
            android/app/build/reports/emergency-media/
            android/app/build/outputs/mapping/connectedMediaLab/
            android/app/build/outputs/mapping/connectedMediaLabAndroidTest/
          if-no-files-found: error
          retention-days: 7
  emergency-nearby:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Start evidence before toolchain installation
        run: |
          mkdir -p android/app/build/reports/emergency-nearby
          git rev-parse HEAD > android/app/build/reports/emergency-nearby/commit.txt
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Install the project SDK and isolated AVD image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "emulator" "system-images;android-35;default;x86_64" 2>&1 | tee android/app/build/reports/emergency-nearby/sdk-install.log
      - name: Install pinned synthetic admission signing dependency
        run: python -m pip install -r relay/requirements-hashed.lock
      - name: Build actual debug or isolated optimized target
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android --no-daemon :app:assembleConnectedDebug :app:assembleConnectedDebugAndroidTest :app:assembleOfflineDebug :app:assembleOfflineDebugAndroidTest
      - name: Emergency closure after authenticated RFCOMM and delivery
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          export UMBRA_DEVICE_REPORTS=android/app/build/reports/emergency-nearby
          mkdir -p "$UMBRA_DEVICE_REPORTS"
          git rev-parse HEAD > "$UMBRA_DEVICE_REPORTS/commit.txt"
          source scripts/ci_emulator.sh
          umbra_start_avd umbra-video-a 5554
          umbra_start_avd umbra-video-b 5556
          python scripts/pair_bluetooth_emulators.py --serial-a emulator-5554 --serial-b emulator-5556 --log-dir "$UMBRA_DEVICE_REPORTS/pairing"
          python scripts/run_nearby_regressions.py --emergency --pairing "$UMBRA_DEVICE_REPORTS/pairing/pairing.json" --reports "$UMBRA_DEVICE_REPORTS"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: emergency-nearby-evidence-${{ github.sha }}
          path: |
            android/app/build/reports/emergency-nearby/
          if-no-files-found: error
          retention-days: 7
