name: Personal vault password laboratory
"on":
  pull_request:
    paths: ['android/**', 'scripts/**', '.github/workflows/vault-password.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vault-password-${{ github.ref }}
  cancel-in-progress: false
jobs:
  vault-password:
    strategy:
      fail-fast: false
      matrix:
        optimized: [false, true]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Record the tested checkout
        run: |
          mkdir -p android/app/build/reports/password
          git rev-parse HEAD > android/app/build/reports/password/commit.txt
          git rev-parse HEAD^{tree} > android/app/build/reports/password/tree.txt
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "emulator" "system-images;android-35;default;x86_64"
      - name: Build both real application flavors and isolated test APKs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.optimized }}" = true ]; then
            gradle -p android --no-daemon -PumbraVaultLab=true :app:assembleConnectedVaultLab :app:assembleOfflineVaultLab :app:assembleConnectedVaultLabAndroidTest :app:assembleOfflineVaultLabAndroidTest
          else
            gradle -p android --no-daemon :app:assembleConnectedDebug :app:assembleOfflineDebug :app:assembleConnectedDebugAndroidTest :app:assembleOfflineDebugAndroidTest
          fi
      - name: SQLite, Keystore, password and actual force-stop on Android
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          export UMBRA_DEVICE_REPORTS=android/app/build/reports/password
          source scripts/ci_emulator.sh
          umbra_start_avd umbra-password 5554
          options=()
          if [ "${{ matrix.optimized }}" = true ]; then options+=(--optimized); fi
          for flavor in connected offline; do
            python scripts/run_password_tests.py --serial emulator-5554 --flavor "$flavor" "${options[@]}" --reports "$UMBRA_DEVICE_REPORTS/$flavor"
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: vault-password-${{ matrix.optimized }}-${{ github.sha }}
          path: |
            android/app/build/reports/password/
            android/app/build/outputs/mapping/*VaultLab/
          if-no-files-found: error
          retention-days: 7
