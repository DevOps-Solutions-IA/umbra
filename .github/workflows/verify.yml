name: Verify UMBRA
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: umbra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.12'
      - name: Source and history hygiene
        run: python scripts/repository_guard.py --git-history
      - name: Handoff tooling tests (not Android tests)
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
  relay-and-core:
    needs: repository-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5, Node 24
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -r relay/requirements-test.lock
      - run: bash scripts/test_local.sh
  relay-container:
    needs: relay-and-core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
      - name: Build relay container (not a deployment)
        run: docker build --pull -t umbra-relay:ci relay
      - name: Non-root isolated container health smoke test
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f umbra-relay-ci >/dev/null 2>&1' EXIT
          docker run --detach --name umbra-relay-ci --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --tmpfs /data:rw,nosuid,uid=10001,gid=10001,mode=0700,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 128 --memory 256m umbra-relay:ci
          for attempt in $(seq 1 30); do
            if docker exec umbra-relay-ci python -c \
              'import urllib.request; r=urllib.request.urlopen("http://127.0.0.1:8080/healthz",timeout=2); assert r.status == 200'; then
              echo 'Container health smoke passed; not a TLS/load/production test.'
              exit 0
            fi
            sleep 2
          done
          echo 'Container health smoke failed.' >&2
          exit 1
  android:
    needs: repository-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5, Node 24
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5, Node 24
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Real libsignal unit tests, Android builds and lint
        working-directory: android
        run: >-
          gradle --no-daemon :app:testConnectedDebugUnitTest :app:testOfflineDebugUnitTest
          :app:assembleConnectedDebug :app:assembleOfflineDebug
          :app:lintConnectedDebug :app:lintOfflineDebug
          :app:assembleConnectedRelease :app:assembleOfflineRelease
          :app:lintConnectedRelease :app:lintOfflineRelease
          :app:assembleConnectedDebugAndroidTest :app:assembleOfflineDebugAndroidTest
      - name: Reject missing, empty, failed or skipped JVM suites
        run: python scripts/check_android_tests.py
      - name: Check merged manifests
        run: python scripts/check_merged_permissions.py
      - name: Inspect debug APK permissions and Signal JNI
        run: python scripts/check_debug_apks.py --include-release
      - name: Inspect compiled manifest, TLS, backup and production DEX policy
        run: python scripts/check_apk_policy.py --include-release
      - name: Install hashed integration test dependencies
        run: python -m pip install -r relay/requirements-test.lock
      - name: Real JVM client against isolated HTTPS relay
        run: python scripts/test_relay_integration.py
      - name: Install disposable Android 35 emulator
        run: sdkmanager "emulator" "system-images;android-35;default;x86_64"
      - name: Grant this ephemeral runner group access to KVM
        run: |
          test -c /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Execute both variants on Android (software Keystore rejection, no hardware claim)
        shell: bash
        run: |
          set -euo pipefail
          if command -v android; then android --help; else echo "Android CLI absent; using installed avdmanager"; fi
          nproc
          free -m
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tcpdump
          source scripts/ci_emulator.sh
          umbra_start_avd umbra-ci 5554
          python scripts/run_android_instrumentation.py --serial emulator-5554 --flavor connected --log android/app/build/reports/device/connected.log
          python scripts/run_android_instrumentation.py --serial emulator-5554 --flavor offline --log android/app/build/reports/device/offline.log
          python scripts/run_location_restart.py --serial emulator-5554 --flavor connected --log-dir android/app/build/reports/device/
          python scripts/run_location_restart.py --serial emulator-5554 --flavor offline --log-dir android/app/build/reports/device/
          python scripts/smoke_release_launch.py --serial emulator-5554 > android/app/build/reports/device/release-launch.log
          python scripts/run_voice_probe.py --serial emulator-5554 --log android/app/build/reports/device/native-voice-probe.log
          source scripts/ci_bluetooth.sh
      - name: Record checked-out commit and APK digests
        run: |
          git rev-parse HEAD > android/app/build/reports/commit.txt
          sha256sum android/app/build/outputs/apk/*/debug/*.apk android/app/build/outputs/apk/*/release/*.apk > android/app/build/reports/apk-sha256.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: UMBRA-debug-unreviewed-${{ github.sha }}
          path: android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        if: always()
        with:
          name: Android-test-and-lint-results-${{ github.sha }}
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results*
            android/app/build/reports/device/
            android/app/build/reports/commit.txt
            android/app/build/reports/apk-sha256.txt
          if-no-files-found: warn
          retention-days: 7
