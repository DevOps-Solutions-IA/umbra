name: Verify UMBRA
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: umbra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Source and history hygiene
        run: python scripts/repository_guard.py --git-history
      - name: Handoff tooling tests (not Android tests)
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
  relay-and-core:
    needs: repository-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -c relay/requirements.lock -r relay/requirements-test.txt
      - run: bash scripts/test_local.sh
  relay-container:
    needs: relay-and-core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build relay container (not a deployment)
        run: docker build --pull -t umbra-relay:ci relay
      - name: Non-root isolated container health smoke test
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f umbra-relay-ci >/dev/null 2>&1' EXIT
          docker run --detach --name umbra-relay-ci --network none --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --tmpfs /data:rw,nosuid,uid=10001,gid=10001,mode=0700,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 128 --memory 256m umbra-relay:ci
          for attempt in $(seq 1 30); do
            if docker exec umbra-relay-ci python -c \
              'import urllib.request; r=urllib.request.urlopen("http://127.0.0.1:8080/healthz",timeout=2); assert r.status == 200'; then
              echo 'Container health smoke passed; not a TLS/load/production test.'
              exit 0
            fi
            sleep 2
          done
          echo 'Container health smoke failed.' >&2
          exit 1
  android:
    needs: repository-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Real libsignal unit tests, Android builds and lint
        working-directory: android
        run: >-
          gradle --no-daemon :app:testConnectedDebugUnitTest :app:testOfflineDebugUnitTest
          :app:assembleConnectedDebug :app:assembleOfflineDebug
          :app:lintConnectedDebug :app:lintOfflineDebug
      - name: Check merged manifests (APK inspection remains an additional release gate)
        run: python scripts/check_merged_permissions.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UMBRA-debug-unreviewed-${{ github.sha }}
          path: android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Android-test-and-lint-results-${{ github.sha }}
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results*
          if-no-files-found: warn
          retention-days: 7
