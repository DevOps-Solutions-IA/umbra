name: Optimized media laboratory
"on":
  pull_request:
    paths: ['android/**', 'scripts/**', '.github/workflows/media-optimized.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: optimized-media-${{ github.ref }}
  cancel-in-progress: true
jobs:
  optimized-voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "emulator" "system-images;android-35;default;x86_64"
      - run: python -m pip install -r relay/requirements-test.lock
      - name: Build isolated non-debuggable R8 target and test APK
        working-directory: android
        run: gradle --no-daemon -PumbraMediaLab=true :app:assembleConnectedMediaLab :app:assembleConnectedMediaLabAndroidTest
      - name: Check optimized implementation and APK identity
        run: |
          set -euo pipefail
          mkdir -p android/app/build/reports/optimized-media
          git rev-parse HEAD > android/app/build/reports/optimized-media/commit.txt
          python scripts/check_optimized_media.py > android/app/build/reports/optimized-media/optimized-apk.json
      - name: Execute real two-AVD voice on R8 code
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tcpdump
          export UMBRA_DEVICE_REPORTS=android/app/build/reports/optimized-media
          source scripts/ci_emulator.sh
          umbra_start_avd umbra-r8-a 5554
          umbra_start_avd umbra-r8-b 5556
          for scenario in audio direct-blocked expired-auth allocation-expiry invalid-auth unreachable turn-loss trust-loss lock credential-expiry device-revoked storage-failure force-stop permission-revoked unauthorized-redirect; do
            python scripts/run_voice_integration.py --a emulator-5554 --b emulator-5556 --optimized --scenario "$scenario" --reports "$UMBRA_DEVICE_REPORTS/$scenario"
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: optimized-media-evidence-${{ github.sha }}
          path: |
            android/app/build/reports/optimized-media/
            android/app/build/outputs/mapping/connectedMediaLab/
            android/app/build/outputs/mapping/connectedMediaLabAndroidTest/
          if-no-files-found: error
          retention-days: 7
