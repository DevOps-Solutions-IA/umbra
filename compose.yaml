services:
  relay:
    build: ./relay
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - relay_data:/data
    expose: ["8080"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    networks: [private]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      UMBRA_DOMAIN: ${UMBRA_DOMAIN:?Set UMBRA_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    depends_on:
      relay:
        condition: service_healthy
    networks: [private]
volumes:
  relay_data:
  caddy_data:
  caddy_config:
networks:
  private:
